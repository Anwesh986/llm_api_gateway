services:
    postgres:
        image: postgres:16-alpine
        container_name: api_gateway-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-gateway}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway}
            POSTGRES_DB: ${POSTGRES_DB:-gateway}
        ports:
            - "5432:5432"
        volumes:
            - ./data:/var/lib/postgresql/data
            - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gateway} -d ${POSTGRES_DB:-gateway}" ]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    redis:
        image: redis:7-alpine
        container_name: api_gateway-redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - ./redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

volumes:
    postgres-data:
    redis-data:
