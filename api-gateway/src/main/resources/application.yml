
server:
  port: 8080

spring:
  application:
    name: api-gateway

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/llm_gateway_db}
    username: ${POSTGRES_USER:gateway_admin}
    password: ${POSTGRES_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: GatewayHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s


# This default assumes you run api-gateway and model-router-service on the same machine. 
# If both run in Docker Compose, use the router's Compose service name as the hostname instead of localhost
grpc:
  model-router:
    host: localhost
    port: 9090

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
    issuer: llm-api-gateway