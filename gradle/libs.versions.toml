[versions]
java = "21"

spring-boot = "3.3.4"
spring-dependency-management = "1.1.6"
protobuf-plugin = "0.9.4"

protobuf-version = "3.25.1"
grpc-version = "1.60.0"
grpc-spring-boot = "3.0.0.RELEASE"

lombok = "1.18.34"
junit = "5.10.3"
annotations-api = "6.0.53"
jjwt = "0.12.3"

[libraries]
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf-version" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc-version" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc-version" }
grpc-server-spring-boot = { module = "net.devh:grpc-server-spring-boot-starter", version.ref = "grpc-spring-boot" }
grpc-client-spring-boot = { module = "net.devh:grpc-client-spring-boot-starter", version.ref = "grpc-spring-boot" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
annotations-api = { module = "org.apache.tomcat:annotations-api", version.ref = "annotations-api" }
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }
grpc-inprocess = { module = "io.grpc:grpc-inprocess", version.ref = "grpc-version" }
grpc-testing = { module = "io.grpc:grpc-testing", version.ref = "grpc-version" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }